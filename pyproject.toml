[project]
name = "analysis-plan-studio"
version = "0.1.0"
description = "Analysis Plan Studio — 分析计划与验证工具（Analysis IR Toolkit 共享内核）"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "rfc8785>=0.1.4",
    "duckdb>=1.1",
    "rfc3339-validator>=0.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-jsonschema>=4.26.0.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toolkit", "adapters", "methods", "app"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["toolkit", "adapters", "methods"]
